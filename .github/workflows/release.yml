name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag $TAG does not match manifest version $VER"
            exit 1
          fi

      - name: Build zip
        run: cd extension && zip -r ../gh-switcher.zip . -x "*.DS_Store"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: gh-switcher.zip
          generate_release_notes: true